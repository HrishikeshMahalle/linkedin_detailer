services:
  - type: web
    name: linkedin-profile-api
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_API_KEY
        sync: false
      - key: LINKEDIN_LI_AT
        sync: false
      - key: LINKEDIN_JSESSIONID
        sync: false
      - key: LINKEDIN_DECORATION_ID
        value: com.linkedin.voyager.dash.deco.identity.profile.FullProfileWithEntities-93
      - key: CACHE_TTL
        value: 30m
      - key: CACHE_MAX_ENTRIES
        value: "200"
      - key: MAX_CONCURRENT_SCRAPES
        value: "2"
      - key: RATE_LIMIT_RPM
        value: "10"
      - key: RATE_LIMIT_BURST
        value: "3"
      - key: LINKEDIN_REQUEST_INTERVAL
        value: 2s
      - key: REQUEST_TIMEOUT
        value: 25s
      - key: UPSTREAM_TIMEOUT
        value: 15s
      - key: LINKEDIN_COOLDOWN
        value: 15m
